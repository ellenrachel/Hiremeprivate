<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HireMePrivate.com - Private Senior Home Care Directory</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="bg-blue-900 text-white shadow-md">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide">HireMePrivate<span class="text-blue-300">.com</span></h1>
            <div class="flex items-center gap-3">
                <span class="text-xs bg-blue-800 px-3 py-1 rounded-full text-blue-200 hidden sm:inline-block">Secure Direct Directory</span>
                <button onclick="openRegisterModal()" class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold px-4 py-2 rounded-lg transition shadow-sm">
                    Register
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-5xl w-full mx-auto px-4 py-8">
        
        <!-- Intro Hero Section -->
        <div class="text-center mb-10">
            <h2 class="text-3xl font-extrabold text-slate-900 mb-2">Find Independent Senior Care</h2>
            <p class="text-slate-600 max-w-xl mx-auto">Connect directly with experienced, private home care providers in your local area or list your professional profile.</p>
        </div>

        <!-- Advanced Search & Filter Card -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Search by Name or Keyword</label>
                    <input type="text" id="searchName" placeholder="e.g. Provider Name" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Location / Zip Code</label>
                    <input type="text" id="searchZip" placeholder="e.g. 11751" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Care Specialty</label>
                    <select id="searchSpecialty" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600 bg-white text-sm">
                        <option value="">All Specialties</option>
                        <option value="Companion Care">Companion Care</
