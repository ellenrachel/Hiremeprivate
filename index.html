<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HireMePrivate.com - Private Care & Service Directory</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased flex flex-col min-h-screen">

    <!-- Header Navigation -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="#" class="text-xl font-bold text-blue-600">HireMePrivate<span class="text-slate-700">.com</span></a>
            <div class="flex items-center gap-4">
                <nav class="hidden sm:flex space-x-4">
                    <a href="#search" class="text-slate-600 hover:text-blue-600 font-medium">Find Professional</a>
                </nav>
                <button onclick="openRegisterModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-blue-700 transition shadow-sm">
                    Register
                </button>
            </div>
        </div>
    </header>

    <!-- Hero Section with Family / Care Imagery -->
    <section class="relative bg-slate-900 text-white py-20 px-4 text-center overflow-hidden">
        <div class="absolute inset-0 opacity-30">
            <img src="https://images.unsplash.com/photo-1581578731548-c64695cc6952?auto=format&fit=crop&w=1600&q=80" alt="Family and Care" class="w-full h-full object-cover">
        </div>
        <div class="relative max-w-3xl mx-auto z-10">
            <h1 class="text-3xl md:text-5xl font-bold mb-4">Connect Directly with Independent Private Caregivers & Specialists</h1>
            <p class="text-lg text-slate-200 mb-8">Find trusted, independent senior sitters, companions, pet sitters, babysitters, and private household professionals on your terms.</p>
            <div class="flex justify-center gap-4">
                <a href="#search" class="bg-blue-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-blue-700 transition shadow-md">Browse Directory</a>
                <button onclick="openRegisterModal()" class="bg-white text-slate-900 px-6 py-3 rounded-lg font-medium hover:bg-slate-100 transition shadow-md">Worker Sign Up</button>
            </div>
        </div>
    </section>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-12 space-y-16">

        <!-- Category Image Cards Grid -->
